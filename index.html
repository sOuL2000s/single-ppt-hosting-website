<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Premium Presentation Library</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* Sophisticated Color Palette */
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --primary: #6366f1; /* Indigo */
            --primary-hover: #818cf8;
            --accent: #10b981; /* Emerald */
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
            --glass: rgba(30, 41, 59, 0.7);
            
            /* Shadows & Blur */
            --shadow-sm: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.3);
            --blur: blur(12px);
            
            /* Transitions */
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-body);
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
            min-height: 100vh;
        }

        h1, h2, h3 {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        /* Smooth Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-body); }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

        /* Wrapper */
        .page-wrapper {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* --- Header / Hero Section --- */
        .hero {
            padding: 80px 20px 60px;
            text-align: center;
            background: radial-gradient(circle at top center, rgba(99, 102, 241, 0.15) 0%, transparent 70%);
            position: relative;
        }

        .hero h1 {
            font-size: clamp(2.5rem, 8vw, 4rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 16px;
        }

        .hero p {
            color: var(--text-muted);
            font-size: clamp(1rem, 2vw, 1.25rem);
            max-width: 600px;
            margin: 0 auto;
        }

        /* --- Grid Container --- */
        .main-content {
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 24px 80px;
            width: 100%;
        }

        .ppt-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
            list-style: none;
        }

        /* --- Card Design --- */
        .ppt-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .ppt-item:hover {
            transform: translateY(-10px);
            border-color: var(--primary);
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.2);
        }

        .ppt-item::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at top right, rgba(99, 102, 241, 0.1), transparent 50%);
            pointer-events: none;
        }

        .ppt-icon-box {
            width: 56px;
            height: 56px;
            background: rgba(99, 102, 241, 0.1);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            color: var(--primary);
            font-size: 24px;
            transition: var(--transition);
        }

        .ppt-item:hover .ppt-icon-box {
            background: var(--primary);
            color: white;
            transform: rotate(-5deg) scale(1.1);
        }

        .ppt-item h2 {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-main);
            overflow-wrap: break-word;
            line-height: 1.4;
        }

        .ppt-item p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 24px;
            flex-grow: 1;
        }

        .view-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            padding: 12px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: var(--transition);
            border: 1px solid var(--border);
        }

        .ppt-item:hover .view-btn {
            background: var(--primary);
            border-color: var(--primary);
        }

        /* --- Skeleton Loader (Enhanced) --- */
        .skeleton-item {
            background: var(--bg-card);
            border-radius: 20px;
            height: 280px;
            padding: 24px;
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
        }

        .skeleton-item::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            animation: loading 1.5s infinite;
        }

        @keyframes loading {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        /* --- Viewer Section (Full Screen Experience) --- */
        #pptViewerSection {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-body);
            z-index: 9999;
            flex-direction: column;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .viewer-nav {
            padding: 12px 20px;
            background: var(--glass);
            backdrop-filter: var(--blur);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .viewer-nav h2 {
            font-size: 1rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 50%;
        }

        .nav-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            color: white;
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
        }

        .nav-btn:hover { background: rgba(255,255,255,0.15); }
        .nav-btn.back { color: #fca5a5; border-color: rgba(239, 68, 68, 0.2); }
        .nav-btn.full { color: #6ee7b7; border-color: rgba(16, 185, 129, 0.2); }

        .viewer-frame-container {
            flex-grow: 1;
            background: #000;
            position: relative;
        }

        .viewer-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Responsive Adjustments */
        @media (max-width: 640px) {
            .hero { padding: 60px 20px 40px; }
            .ppt-grid { grid-template-columns: 1fr; }
            .viewer-nav h2 { display: none; } /* Hide title on small mobile to save space */
            .main-content { padding: 0 16px 60px; }
        }
    </style>
</head>
<body>

    <div class="page-wrapper" id="homePage">
        <header class="hero">
            <h1>LibreSlides</h1>
            <p>Access our curated collection of high-impact presentations. Seamless, fast, and fully responsive.</p>
        </header>

        <main class="main-content">
            <!-- Loading State -->
            <div id="skeletonLoader" class="ppt-grid">
                <div class="skeleton-item"></div>
                <div class="skeleton-item"></div>
                <div class="skeleton-item"></div>
            </div>

            <!-- Content -->
            <ul class="ppt-grid" id="pptGridList" style="display: none;"></ul>
        </main>
    </div>

    <!-- PPT Viewer -->
    <div id="pptViewerSection">
        <div class="viewer-nav">
            <button class="nav-btn back" onclick="hideViewer()">
                <i class="fas fa-chevron-left"></i> <span>Back</span>
            </button>
            <h2 id="viewerTitle">Presentation</h2>
            <button class="nav-btn full" onclick="toggleFullscreen()">
                <i class="fas fa-expand"></i> <span>Expand</span>
            </button>
        </div>
        <div class="viewer-frame-container">
            <iframe id="viewerIframe" class="viewer-iframe" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        const GITHUB_REPO_OWNER = 'sOuL2000s';
        const GITHUB_REPO_NAME = 'single-ppt-hosting-website';
        const GITHUB_BRANCH = 'main';
        const GITHUB_API_URL = `https://api.github.com/repos/${GITHUB_REPO_OWNER}/${GITHUB_REPO_NAME}/contents?ref=${GITHUB_BRANCH}`;
        const OFFICE_VIEWER_BASE_URL = 'https://view.officeapps.live.com/op/view.aspx?src=';

        const pptGridList = document.getElementById('pptGridList');
        const skeletonLoader = document.getElementById('skeletonLoader');
        const pptViewerSection = document.getElementById('pptViewerSection');
        const viewerIframe = document.getElementById('viewerIframe');
        const viewerTitleElement = document.getElementById('viewerTitle');

        async function fetchPptFiles() {
            try {
                const response = await fetch(GITHUB_API_URL);
                if (!response.ok) throw new Error('API limit reached or repo not found');
                const contents = await response.json();

                const ppts = contents
                    .filter(item => item.type === 'file' && item.name.toLowerCase().endsWith('.pptx'))
                    .map(item => {
                        const cleanTitle = item.name
                            .replace(/\.pptx$/i, '')
                            .replace(/[_-]/g, ' ');
                        
                        return {
                            title: cleanTitle,
                            url: `${OFFICE_VIEWER_BASE_URL}${encodeURIComponent(item.download_url)}`
                        };
                    });
                
                renderList(ppts);
            } catch (error) {
                console.error(error);
                pptGridList.innerHTML = `<p style="text-align:center; grid-column: 1/-1; color: #f87171;">Error loading presentations. Please refresh or try again later.</p>`;
                hideSkeleton();
            }
        }

        function renderList(ppts) {
            hideSkeleton();
            if (ppts.length === 0) {
                pptGridList.innerHTML = `<p style="text-align:center; grid-column: 1/-1;">No presentations found in the repository.</p>`;
                return;
            }

            pptGridList.innerHTML = ppts.map(ppt => `
                <li class="ppt-item" onclick="showViewer('${ppt.url.replace(/'/g, "\\'")}', '${ppt.title.replace(/'/g, "\\'")}')">
                    <div class="ppt-icon-box">
                        <i class="fas fa-display"></i>
                    </div>
                    <h2>${ppt.title}</h2>
                    <p>Professional PowerPoint presentation. Click to view in full resolution.</p>
                    <div class="view-btn">
                        Open Presentation <i class="fas fa-arrow-right"></i>
                    </div>
                </li>
            `).join('');
        }

        function hideSkeleton() {
            skeletonLoader.style.display = 'none';
            pptGridList.style.display = 'grid';
        }

        function showViewer(url, title) {
            viewerIframe.src = url;
            viewerTitleElement.textContent = title;
            pptViewerSection.style.display = 'flex';
            document.body.style.overflow = 'hidden';
            history.pushState({viewing: true}, title, `#${encodeURIComponent(title)}`);
        }

        function hideViewer() {
            pptViewerSection.style.display = 'none';
            viewerIframe.src = '';
            document.body.style.overflow = 'auto';
            if(window.location.hash) history.replaceState(null, '', window.location.pathname);
        }

        function toggleFullscreen() {
            const container = document.getElementById('viewerIframe');
            if (container.requestFullscreen) container.requestFullscreen();
            else if (container.webkitRequestFullscreen) container.webkitRequestFullscreen();
            else if (container.msRequestFullscreen) container.msRequestFullscreen();
        }

        // Handle Browser Back Button
        window.onpopstate = (event) => {
            if (pptViewerSection.style.display === 'flex') {
                hideViewer();
            }
        };

        // Init
        fetchPptFiles();
    </script>
</body>
</html>
